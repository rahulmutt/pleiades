# Transcendentals must go through the pure-Rust `libm` crate (#288) so results
# do not depend on the host C library. `sqrt`, `powi`, `mul_add`, rounding and
# degree/radian conversion are deliberately absent: they are IEEE-exact or
# compiler-lowered, so they never reach the host C library.
disallowed-methods = [
    { path = "f64::sin", reason = "use libm::sin (host-libm-independent results, #288)" },
    { path = "f64::cos", reason = "use libm::cos (host-libm-independent results, #288)" },
    { path = "f64::tan", reason = "use libm::tan (host-libm-independent results, #288)" },
    { path = "f64::asin", reason = "use libm::asin (host-libm-independent results, #288)" },
    { path = "f64::acos", reason = "use libm::acos (host-libm-independent results, #288)" },
    { path = "f64::atan", reason = "use libm::atan (host-libm-independent results, #288)" },
    { path = "f64::atan2", reason = "use libm::atan2 (host-libm-independent results, #288)" },
    { path = "f64::sin_cos", reason = "use libm::sincos (host-libm-independent results, #288)" },
    { path = "f64::sinh", reason = "use libm::sinh (host-libm-independent results, #288)" },
    { path = "f64::cosh", reason = "use libm::cosh (host-libm-independent results, #288)" },
    { path = "f64::tanh", reason = "use libm::tanh (host-libm-independent results, #288)" },
    { path = "f64::asinh", reason = "use libm::asinh (host-libm-independent results, #288)" },
    { path = "f64::acosh", reason = "use libm::acosh (host-libm-independent results, #288)" },
    { path = "f64::atanh", reason = "use libm::atanh (host-libm-independent results, #288)" },
    { path = "f64::exp", reason = "use libm::exp (host-libm-independent results, #288)" },
    { path = "f64::exp2", reason = "use libm::exp2 (host-libm-independent results, #288)" },
    { path = "f64::exp_m1", reason = "use libm::expm1 (host-libm-independent results, #288)" },
    { path = "f64::ln", reason = "use libm::log (host-libm-independent results, #288)" },
    { path = "f64::log", reason = "use ln(x)/ln(base) via libm::log (host-libm-independent results, #288)" },
    { path = "f64::log2", reason = "use libm::log2 (host-libm-independent results, #288)" },
    { path = "f64::log10", reason = "use libm::log10 (host-libm-independent results, #288)" },
    { path = "f64::ln_1p", reason = "use libm::log1p (host-libm-independent results, #288)" },
    { path = "f64::powf", reason = "use libm::pow (host-libm-independent results, #288)" },
    { path = "f64::cbrt", reason = "use libm::cbrt (host-libm-independent results, #288)" },
    { path = "f64::hypot", reason = "use libm::hypot (host-libm-independent results, #288)" },
]
