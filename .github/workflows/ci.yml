name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # blocking-CI budget: target <=10 min; hard cap raised to 20 for cold-cache / runner-variance headroom (real runs land ~10-13 min)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks (mise run secrets) scans full history

      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          install: false

      # Two caches with different lifetimes. Keep explanations up here: `path`
      # is a literal block, so a trailing `# ...` on a path line is part of the
      # path, matches nothing, and silently drops that entry.
      #
      # 1. Toolchain, Cargo home and the mise-installed tool binaries (avoids
      #    recompiling the `cargo:` tools, ~8 min). Immutable per key: an
      #    exact hit is not re-saved, which is fine because nothing in it
      #    changes between runs with the same mise.toml and Cargo.lock.
      - name: Cache Rust toolchain, Cargo, and mise tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo
            ~/.local/share/mise
          key: ${{ runner.os }}-tools-${{ hashFiles('mise.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-tools-

      # 2. `target`, rolled forward on every run (same pattern as the fuzz
      #    corpus cache): the key carries the run id so it never hits exactly,
      #    the restore-keys pick the newest build this run may see (GitHub
      #    scopes caches: a push run sees its branch and main, a pull_request
      #    run sees main only), and the save step below writes a fresh entry
      #    for the next one. Without that roll-
      #    forward the marker cargo-cache-mtimes.sh relies on would be frozen
      #    at the last Cargo.lock change. The `target` cache is kept apart
      #    from the tools cache because a legacy tools entry would otherwise
      #    extract a markerless `target` underneath the real one.
      - name: Restore cached workspace builds
        uses: actions/cache/restore@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('mise.toml', 'Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-target-${{ hashFiles('mise.toml', 'Cargo.lock') }}-
            ${{ runner.os }}-target-

      - name: Install mise-managed tools
        run: mise install

      # Without this, the restored `target` only serves registry crates: the
      # checkout gives every source a new mtime and cargo rebuilds all
      # first-party crates (FU-23 (b)). The script keeps a file old only when
      # its content matches the cached build's commit, so a wrong cache can
      # never yield a stale build; see .github/scripts/cargo-cache-mtimes.sh.
      - name: Reuse cached workspace builds
        run: .github/scripts/cargo-cache-mtimes.sh

      - name: Run workspace checks
        run: mise run ci

      # Not on pull_request: that event builds an ephemeral merge commit which
      # later runs cannot fetch, so its marker would be useless. The push run
      # of the same commit saves an equivalent entry with a branch commit.
      - name: Save workspace builds
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('mise.toml', 'Cargo.lock') }}-${{ github.run_id }}
