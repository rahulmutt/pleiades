name: Mutants

# Weekly rather than nightly because the signal changes slowly — mutation
# score moves when test STRATEGY changes, not on every commit, so a nightly
# cadence would just burn CI minutes re-measuring something that hasn't
# changed. Separate from nightly.yml on purpose: nightly's 60-minute budget is
# already consumed by test-full, package-check, benchmark, deny and secrets,
# and this tier's cold-cache cost (plus future crate growth) doesn't belong
# inside that already-tight envelope.
on:
  schedule:
    - cron: "0 9 * * 1" # 09:00 UTC Mondays — offset from nightly (06:00) and fuzz (03:00)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  # The ubuntu-24.04 standard runner has 4 vCPUs; cargo-mutants reads this natively.
  # Pinned rather than left to default so the weekly wall-clock stays
  # comparable run to run.
  CARGO_MUTANTS_JOBS: 4

jobs:
  mutants:
    name: mutants (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    # Four round-robin shards in parallel (`mise run mutants --shard k/4`),
    # one runner each. History and calibration:
    #
    # 2026-07-25: the first scheduled run (run 29733596109, three crates,
    # 1,415 mutants) took 16m05s of job wall-clock; cargo-mutants itself
    # reported ~10m, the rest was fixed checkout/install/upload overhead.
    # pleiades-houses (2026-07), pleiades-apsides (2026-09-08) and
    # pleiades-backend (2026-10-16, 269 mutants, ~67 per shard; 3m locally
    # at -j4), pleiades-ayanamsa (2026-10-16, 359 mutants, ~90 per shard;
    # 2m locally at -j4) and pleiades-fict (2026-10-16, 315 mutants, ~79 per
    # shard; 2m locally at -j4) joined later.
    #
    # 2026-10-15 (#258): the single-job run stopped fitting. Measured from the
    # mutants-report artifacts (outcomes.json phase durations, summed over
    # the four cargo-mutants workers):
    #
    #   run (date)               mutants  testing step   houses rebuild/mutant
    #   36456663938 (09-28)        2,866  35m00s         4.0s median
    #   37350152421 (10-05)        3,195  69m35s         7.7s median
    #   38291003053 (10-12)        3,521  >75m, timed    10.4s median
    #                                     out at 2,559
    #
    # Two things compound. The mutant count grew 23% in two weeks (apparent
    # 791 -> 1,241, time 335 -> 475, apsides 223 -> 282). And the cost per
    # mutant, nearly all of it the opt-level=2 rebuild of the mutated crate,
    # varies ~2.5x between runners: pleiades-houses barely changed across
    # those runs and the toolchain bump between them (1.98.1 -> 1.99.0)
    # costs nothing measurable locally (~3.0 CPU-s per houses mutant on
    # both), yet its median rebuild went 4.0s -> 10.4s. At the slowest rate
    # seen, the full set is ~24,000 worker-seconds: ~100 min on one runner.
    #
    # Split four ways that is ~25 min of testing per shard, plus the ~0.5 min
    # unmutated baseline each shard repeats and ~1 min of setup on a warm
    # tools cache (~9 min cold). The 60-minute step timeout below leaves over
    # 2x headroom at the slowest runner rate seen; the job's 75 is the outer
    # backstop. First sharded run (run 38816956184, 2026-10-15, 880-881
    # mutants per shard, warm tools cache with a 0s install): testing steps
    # 20m13s, 21m36s, 24m15s and 26m02s; the longest job took 26m33s. When the set grows, add a shard (update `shard`, the job
    # name and the `--shard` divisor together) rather than raising these: a
    # shard costs ~1-2 runner minutes of overhead, while one long job is
    # bounded by GitHub's 6 h job limit and takes hours to report.
    timeout-minutes: 75
    strategy:
      # One shard's failure must not cancel the others: a cancelled shard
      # uploads no report, and the other shards' outcomes are still valid.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          install: false

      # The same toolchain/tools cache key as ci.yml and nightly.yml. The
      # former mutants-only key (`-mutants-`) was touched once a week, so with
      # the repository's caches over GitHub's 10 GB limit it was always the
      # least recently used entry and was evicted before the next run: the
      # runs of 2026-09-28, 10-05 and 10-12 all found no cache and compiled
      # cargo-fuzz, cargo-mutants, cargo-release and cargo-nextest from source
      # (6-8 min). The shared key is restored by every CI run, so it stays
      # resident. `target` is not cached: cargo-mutants builds in a copy of
      # the source tree that excludes it, so a restored `target` went unused.
      - name: Cache Rust toolchain, Cargo, and mise tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo
            ~/.local/share/mise
          key: ${{ runner.os }}-tools-${{ hashFiles('mise.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-tools-

      - name: Install mise-managed tools
        run: mise install

      # Report-only tier: exit 2 means "surviving mutants found", which is the
      # EXPECTED steady state and must not fail the job. Exit 1 (usage error),
      # 3 (tests timed out) and 4 (baseline already failing) mean the run could
      # not measure anything and must fail loud — a misconfigured run and a
      # clean run must not look alike. The mapping itself lives in
      # .github/scripts/mutants-exit.sh (not inlined here) so it can be
      # exercised directly in Step 5 of the implementation task instead of
      # being re-implemented and re-verified against itself.
      #
      # Step-level timeout is deliberately shorter than the job-level one.
      # GitHub *cancels* a job that exceeds its job-level timeout, and a
      # wedged shard, the exact case the job timeout exists to catch, would
      # then end "cancelled" with its partial report possibly lost. A step
      # timeout instead makes the step *fail* (not get cancelled), so the
      # upload below still runs and the shard reports "failure". The tracking
      # issue is handled once for the whole run by the `report` job, which
      # runs whatever the shards' outcome. The job-level 75 is the outer
      # backstop in case something outside this step hangs.
      - name: Run mutation baseline
        timeout-minutes: 60
        run: |
          set +e
          mise run mutants --shard "${{ matrix.shard }}/4"
          code=$?
          set -e
          echo "cargo-mutants exit code: $code"
          .github/scripts/mutants-exit.sh "$code"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report-shard-${{ matrix.shard }}
          path: mutants.out/
          if-no-files-found: warn

  # One verdict for the whole run. Per-shard issue steps would race: a green
  # shard's close step could close the issue another shard had just opened.
  # `always()` so a failed or cancelled shard still reaches this job.
  report:
    needs: mutants
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        if: needs.mutants.result != 'success'
        uses: actions/checkout@v4

      - name: Open/update tracking issue on failure
        if: needs.mutants.result != 'success'
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          filename: .github/mutants-failure-issue.md
          update_existing: true
          search_existing: open

      - name: Fail the run when a shard did not measure
        if: needs.mutants.result != 'success'
        run: |
          echo "::error::A mutants shard ended '${{ needs.mutants.result }}'; see the shard jobs."
          exit 1

      - name: Close tracking issue on success
        if: needs.mutants.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue list --label mutants-failure --state open --json number --jq '.[].number' \
            | while read -r n; do
                [ -n "$n" ] && gh issue close "$n" --comment "Mutation run green again on ${{ github.sha }}."
              done
