name: Nightly CI

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks (mise run secrets) scans full history

      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          install: false

      # Same two caches as ci.yml (see the explanation there): immutable tools,
      # and a rolled-forward `target`. This job's `target` entries form their
      # own `-nightly-` lineage; see "Restore cached workspace builds".
      - name: Cache Rust toolchain, Cargo, and mise tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo
            ~/.local/share/mise
          key: ${{ runner.os }}-tools-${{ hashFiles('mise.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-tools-

      # A `target` entry's marker (cargo-cache-mtimes.sh) is only valid for the
      # artifacts the saving job built. The blocking job never builds
      # pleiades-validate's test binaries, so an entry it saved carries those
      # forward from an older build under a newer marker, and the mtime script
      # would judge them fresh: nightlies ran stale pleiades-validate tests
      # that way (FU-23 (w)). So this job prefers its own `-nightly-` entries,
      # which it saves below, and falls back to any entry only without its
      # marker (next step), which rebuilds the workspace crates.
      - name: Restore cached workspace builds
        id: restore-target
        uses: actions/cache/restore@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('mise.toml', 'Cargo.lock') }}-nightly-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-target-${{ hashFiles('mise.toml', 'Cargo.lock') }}-nightly-
            ${{ runner.os }}-target-${{ hashFiles('mise.toml', 'Cargo.lock') }}-
            ${{ runner.os }}-target-

      - name: Distrust another job's cache marker
        if: ${{ !contains(steps.restore-target.outputs.cache-matched-key, '-nightly-') }}
        run: rm -f target/ci-built-from-commit

      - name: Install mise-managed tools
        run: mise install

      # Same as in ci.yml: let the restored `target` serve the workspace
      # crates too (FU-23 (b)); see .github/scripts/cargo-cache-mtimes.sh.
      - name: Reuse cached workspace builds
        run: .github/scripts/cargo-cache-mtimes.sh

      # Step-level timeout, deliberately shorter than the job-level one. GitHub
      # *cancels* a job that exceeds its job-level timeout, and `if: failure()`
      # steps do not run on cancellation — so an over-budget nightly would end
      # "cancelled" with no tracking issue touched, which is how this job ran
      # over budget unnoticed from its first day. A step timeout makes the step
      # *fail* instead, so the issue step below still runs. Same pattern as
      # .github/workflows/mutants.yml.
      - name: Run nightly tier
        timeout-minutes: 50
        run: mise run ci-nightly

      # The nightly tier builds everything `test-full` needs, so its entry is
      # the richest one the blocking job can restore (its `-<hash>-` restore
      # key matches this lineage too), and its marker is valid for every
      # artifact the blocking and gate jobs build.
      - name: Save workspace builds
        uses: actions/cache/save@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('mise.toml', 'Cargo.lock') }}-nightly-${{ github.run_id }}

      - name: Open/update tracking issue on failure
        if: failure()
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          filename: .github/nightly-failure-issue.md
          update_existing: true
          search_existing: open

      - name: Close tracking issue on success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --label nightly-failure --state open --json number --jq '.[].number' \
            | while read -r n; do
                [ -n "$n" ] && gh issue close "$n" --comment "Nightly CI green again on ${{ github.sha }}."
              done

  aspects-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # cargo-cache-mtimes.sh diffs against the cached build's commit

      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          install: false

      # Same tools cache as the other jobs. The gate's only build, the
      # pleiades-validate binary, is part of every blocking run's `target`,
      # so this job restores that cache and does not save one of its own.
      - name: Cache Rust toolchain, Cargo, and mise tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo
            ~/.local/share/mise
          key: ${{ runner.os }}-tools-${{ hashFiles('mise.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-tools-

      - name: Restore cached workspace builds
        uses: actions/cache/restore@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('mise.toml', 'Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-target-${{ hashFiles('mise.toml', 'Cargo.lock') }}-
            ${{ runner.os }}-target-

      - name: Install mise-managed tools
        run: mise install

      - name: Reuse cached workspace builds
        run: .github/scripts/cargo-cache-mtimes.sh

      # Step timeout below the job's 90 so an overrun fails loud (see `nightly`).
      - name: Run full aspects gate
        timeout-minutes: 80
        run: mise run gate-aspects

      - name: Open/update tracking issue on failure
        if: failure()
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          filename: .github/aspects-gate-failure-issue.md
          update_existing: true
          search_existing: open

      - name: Close tracking issue on success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --label aspects-gate-failure --state open --json number --jq '.[].number' \
            | while read -r n; do
                [ -n "$n" ] && gh issue close "$n" --comment "Aspects gate green again on ${{ github.sha }}."
              done

  # The full stations gate was `test-full-validate`'s long pole (FU-23 (u));
  # it runs here, in parallel with the nightly tier, like `aspects-gate`.
  stations-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # cargo-cache-mtimes.sh diffs against the cached build's commit

      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          install: false

      # Same caches as `aspects-gate`: restore the blocking `target` (it holds
      # the pleiades-validate binary) and save none.
      - name: Cache Rust toolchain, Cargo, and mise tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo
            ~/.local/share/mise
          key: ${{ runner.os }}-tools-${{ hashFiles('mise.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-tools-

      - name: Restore cached workspace builds
        uses: actions/cache/restore@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('mise.toml', 'Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-target-${{ hashFiles('mise.toml', 'Cargo.lock') }}-
            ${{ runner.os }}-target-

      - name: Install mise-managed tools
        run: mise install

      - name: Reuse cached workspace builds
        run: .github/scripts/cargo-cache-mtimes.sh

      # Step timeout below the job's 30 so an overrun fails loud (see `nightly`).
      - name: Run full stations gate
        timeout-minutes: 20
        run: mise run gate-stations

      - name: Open/update tracking issue on failure
        if: failure()
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          filename: .github/stations-gate-failure-issue.md
          update_existing: true
          search_existing: open

      - name: Close tracking issue on success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --label stations-gate-failure --state open --json number --jq '.[].number' \
            | while read -r n; do
                [ -n "$n" ] && gh issue close "$n" --comment "Stations gate green again on ${{ github.sha }}."
              done
