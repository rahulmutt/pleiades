name: release-plz

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Publishes crates and creates tags/releases when a version bump lands on main.
  release-plz-release:
    name: release-plz release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          install: false
      - name: Install Rust toolchain
        run: mise install rust
      - name: Run release-plz release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Opens/updates the release PR that bumps versions and prepends the changelog.
  #
  # Runs strictly after the release job. `release-pr` decides the next version
  # by comparing the workspace against crates.io, so when it ran in parallel
  # with a publish it observed a half-published registry (some crates already
  # at the new version, others not) and opened a spurious follow-up bump with
  # an empty changelog section (PR #67 after v0.5.1). Serialising the jobs
  # costs a few minutes on every push to main but removes the race.
  release-plz-pr:
    name: release-plz PR
    needs: release-plz-release
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          install: false
      - name: Install Rust toolchain
        run: mise install rust
      - name: Run release-plz release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
