[package]
name = "pleiades-houses"
description = "House-system catalog, aliases, formula-family metadata, and baseline house calculations for the pleiades astrology workspace."
version = "0.5.5"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
pleiades-apparent = { workspace = true }
pleiades-types = { workspace = true }

[dev-dependencies]
# ΔT lookups for the time-scale regression tests only; the runtime path reaches
# ΔT through `pleiades_apparent::ut1_instant`. Path-only per the workspace
# audit: cargo strips path-only dev-dependencies from the published manifest.
pleiades-time = { path = "../pleiades-time" }
