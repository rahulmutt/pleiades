[env]
# Single source of truth for the dated fuzzing nightly, consumed by the
# `fuzz`/`fuzz-target` tasks below (`cargo "+$FUZZ_NIGHTLY"`). The array
# pin form under `[tools] rust` (`rust = [{...}, "nightly-..."]`) was tried
# here first, but `workspace-audit`'s `[tools]` parser requires `rust =` to
# be a single inline table (main's shape) — an array trips
# `tool-manifest.rust-entry-invalid`/`rust-components-missing`, which is a
# real reproducibility rule (it also verifies the pinned version matches
# `[workspace.package] rust-version` and that rustfmt+clippy are present),
# not something to special-case away for this file. So `[tools] rust` below
# stays byte-identical to main, and `[env] FUZZ_NIGHTLY` above is what the
# mise `fuzz`/`fuzz-target` tasks and CI actually consume; CI installs it
# explicitly (see .github/workflows/fuzz.yml). `fuzz/rust-toolchain.toml`
# mirrors the same date for direct/IDE invocations outside mise (e.g. a bare
# `cd fuzz && cargo fuzz run`), but provisions nothing the pipeline uses.
# That file must repeat the same date string — mise's Tera templating can't
# reach into a file rustup reads directly — so it carries a comment pointing
# back here; keep both dates identical on a bump.
# The nightly's rustc version must be >= `[workspace.package] rust-version`
# (cargo refuses to build the fuzz targets otherwise), so a stable-toolchain
# bump below needs this date checked too. A nightly reports the version it
# is heading for: nightly-2026-10-01 is rustc 1.101.0-nightly.
FUZZ_NIGHTLY = "nightly-2026-10-01"

[tools]
rust = { version = "1.99.0", components = "rustfmt,clippy" }
"cargo:cargo-fuzz" = "0.13.2"
# Mutation testing (report-only, weekly tier — see .github/workflows/mutants.yml).
# Source build: no aqua/prebuilt backend for cargo-mutants, compiled once then
# served from the mise cache. Runs on the pinned STABLE toolchain — unlike
# cargo-fuzz it needs no nightly, so it adds no toolchain surface.
"cargo:cargo-mutants" = "27.1.0"
# Manual-only release fallback (see release.toml); no prebuilt binary for 1.1.6,
# so it stays a source build — compiled once, then served from the mise cache.
"cargo:cargo-release" = "1.1.6"
# Prebuilt-binary backends (aqua = checksum-verified) so `mise install` downloads
# instead of compiling from source — keeps blocking CI inside its wall-clock budget.
"aqua:orhun/git-cliff" = "2.14.2"
"aqua:release-plz/release-plz" = "0.3.169"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
gitleaks = "8.30.1"
# cargo-nextest is published to crates.io as the `cargo-nextest` crate, so the
# cargo backend resolves plain semver versions directly — no monorepo tag-prefix
# ambiguity (the nextest repo tags cargo-nextest-*, nextest-runner-*, …).
"cargo:cargo-nextest" = "0.9.146"

[tasks.fmt]
run = "cargo fmt --all --check"

[tasks.lint]
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks.test]
# Blocking fast suite: exclude pleiades-validate — its ~50 heavy release-validation
# / numeric-gate tests (30s–280s each) dominate wall-clock and belong to the nightly
# tier. They still run in full via `test-full` (nightly) → reachable from release-gate,
# so nothing goes unvalidated at release time.
# `--exclude` rather than a `-E 'not package(...)'` filter: a filter only skips
# *running* the tests, so nextest still compiled pleiades-validate's test
# binaries (its largest compile unit) and then threw them away — `test-full`
# builds its own copy under `-p`, with a different feature unification. The
# selected test list is identical either way; `lint` (`--all-targets`) still
# compile-checks the excluded test code in the blocking tier.
depends = ["test-build"]
run = "cargo nextest run --binaries-metadata target/nextest-binaries.json --cargo-metadata target/nextest-cargo-metadata.json"

[tasks.test-build]
# Compile `test`'s binaries as a step of its own and record what was built, so
# `test` runs them from that record (nextest's reuse-build mode) without
# invoking cargo, and `test-full-build` can compile while `test` runs (FU-23
# (m)). A plain `cargo nextest run` starts with a cargo build, even a no-op one,
# which waits on the build-directory lock for as long as `test-full-build`
# holds it: nightly runs 37230857839 and 37230859135 lost the whole overlap so.
run = [
  "cargo nextest list --workspace --exclude pleiades-validate --list-type binaries-only --message-format json > target/nextest-binaries.json",
  "cargo metadata --format-version 1 > target/nextest-cargo-metadata.json",
]

[tasks.doctest]
run = "cargo test --doc --workspace"

[tasks.test-full]
# Every test, `#[ignore = "slow: ..."]` ones included. The fast suite (`test`)
# stays on nextest; the slow families run under libtest (`cargo test`) on
# purpose. They share expensive fixtures through per-process `OnceLock`s — the
# pristine release bundle, the packaged artifact, the validation report — and
# nextest starts one process PER TEST, so each of the ~250 slow tests rebuilt
# its fixture from scratch (~70 s apiece on a CI runner; `test-full` never
# finished inside the nightly budget). libtest runs a whole test binary in one
# process, so each fixture is built once. See
# docs/superpowers/specs/2026-07-02-release-bundle-test-fixture-design.md.
#   1. all of pleiades-validate (excluded from `test`), ignored tests included;
#   2. only the ignored tests of every other crate (`test` ran the rest).
# The halves are separate tasks so mise runs them concurrently (FU-23 (f)),
# and the second is split again by target kind (FU-23 (n)): run as one
# `cargo test`, the `pleiades-data` ignored tests (~40 s) only started after
# the `pleiades-cli` ones and ran on alone after everything else had ended.
# Splitting by `--bins` / `--lib --test '*'` (not `--tests`, which selects bin
# targets too) keeps the package selection, so cargo resolves the same features
# and both reuse one build.
depends = ["test-full-validate", "test-full-ignored-bins", "test-full-ignored-libs"]

[tasks.test-full-build]
# Compile every `test-full` test binary while `test` runs, rather than after
# it (FU-23 (m)): `pleiades-validate`'s test binary is the largest compile unit
# and the blocking tier, whose build the CI cache usually carries, never builds
# it. The arguments must stay in step with the run tasks below, or they
# recompile.
depends = ["test-build"]
run = [
  "cargo test -p pleiades-validate --lib --bins --tests --no-run",
  "cargo test --workspace --exclude pleiades-validate --lib --bins --tests --no-run",
]

[tasks.test-full-validate]
depends = ["doctest", "test", "test-full-build"]
# libtest's default thread count (one per CPU). Doubling it to stop tests that
# wait on a shared gate run from idling a core was measured on the nightly
# runner and made both halves of `test-full` slower, since the two halves
# already share the cores (FU-23 (j) in docs/follow-ups.md).
run = "cargo test -p pleiades-validate --lib --bins --tests -- --include-ignored"

[tasks.test-full-ignored-bins]
depends = ["doctest", "test", "test-full-build"]
run = "cargo test --workspace --exclude pleiades-validate --bins -- --ignored"

[tasks.test-full-ignored-libs]
depends = ["doctest", "test", "test-full-build"]
run = "cargo test --workspace --exclude pleiades-validate --lib --test '*' -- --ignored"

[tasks.docs]
run = "RUSTDOCFLAGS=\"-D warnings\" cargo doc --workspace --no-deps --all-features"

[tasks.audit]
run = "cargo run -q -p pleiades-validate -- workspace-audit"

[tasks.deny]
run = "cargo deny check"

[tasks.secrets]
run = "gitleaks git ."

[tasks.package-check]
shell = "bash -c"
run = '''
set -euo pipefail
crates="pleiades-types pleiades-apparent pleiades-eclipse pleiades-time pleiades-backend pleiades-apsides pleiades-compression pleiades-houses pleiades-ayanamsa pleiades-vsop87 pleiades-elp pleiades-jpl pleiades-data pleiades-core pleiades-events pleiades-fict"
budget_bytes=$((9 * 1024 * 1024))
# Package all publishable crates together so cargo can resolve intra-workspace
# path dependencies without hitting crates.io (required before first publish).
pkg_args=""
for crate in $crates; do
  pkg_args="$pkg_args --package $crate"
done
cargo package --quiet --no-verify --allow-dirty $pkg_args
for crate in $crates; do
  # Per-crate versioning: each crate declares its own version in its manifest.
  version=$(sed -n 's/^version = "\(.*\)"$/\1/p' "crates/${crate}/Cargo.toml" | head -n 1)
  [ -n "$version" ] || { echo "package-check: could not extract version from crates/${crate}/Cargo.toml" >&2; exit 1; }
  artifact="target/package/${crate}-${version}.crate"
  size=$(wc -c < "$artifact")
  if [ "$size" -gt "$budget_bytes" ]; then
    echo "package-check: $artifact is $size bytes, over the $budget_bytes-byte budget" >&2
    exit 1
  fi
  echo "package-check: $artifact ok ($size bytes)"
done
'''

[tasks.claims-audit]
description = "Run fast claim audit (drift + structural). Pass --full to also run the slow accuracy audit."
run = "cargo run -q -p pleiades-validate -- claims-audit"

[tasks.benchmark]
run = "cargo run -q -p pleiades-validate -- benchmark --rounds 5"

[tasks.fuzz]
description = "Run all fuzz targets for a short budget (local smoke; NOT part of ci or ci-nightly)."
run = """
set -euo pipefail
for target in spk_kernel compression_framing compression_payload ingest_corpus; do
  echo "── fuzzing $target ──"
  cargo "+$FUZZ_NIGHTLY" fuzz run "$target" -- -max_total_time=60
done
"""

[tasks.fuzz-target]
description = "Run one fuzz target for an explicit budget: mise run fuzz-target <name> <seconds>."
run = "cargo \"+$FUZZ_NIGHTLY\" fuzz run {{arg(name=\"target\")}} -- -max_total_time={{arg(name=\"seconds\")}}"

[tasks.mutants]
description = "Mutation testing baseline over the pure-logic crates (report-only; NOT part of ci or ci-nightly)."
# --test-workspace=false is load-bearing, not an optimization: cargo-mutants runs
# the ENTIRE workspace suite per mutant by default, and pleiades-validate /
# pleiades-cli carry individual tests of 300+ seconds (see
# docs/superpowers/plans/test-timings.md). Without this flag one mutant costs
# minutes, and the tier's ~2,843 mutants (1,415 measured over the three prior
# crates + ~1,205 measured for pleiades-houses + 223 measured for
# pleiades-apsides) are unschedulable at any cadence. Restricting to the
# mutated package's own tests is also the semantically correct scope.
# Exit code 2 (surviving mutants found) is an EXPECTED result here, not an error
# — this tier is report-only. See .github/workflows/mutants.yml for the mapping.
run = """
cargo mutants \
  --test-tool nextest \
  --test-workspace=false \
  --baseline run \
  -p pleiades-types \
  -p pleiades-time \
  -p pleiades-apparent \
  -p pleiades-houses \
  -p pleiades-apsides
"""

[tasks.mutants-crate]
description = "Mutation testing for one crate: mise run mutants-crate <name>."
run = "cargo mutants --test-tool nextest --test-workspace=false --baseline run -p {{arg(name=\"crate\")}}"

[tasks.release-smoke]
run = "cargo run -q -p pleiades-validate -- release-smoke"

[tasks.release-gate]
# Not a dependency: `release-smoke`. The `release-gate` command performs the
# same smoke checks itself (`validate_release_gate_at` wraps
# `validate_release_smoke_at`: numeric battery, bundle render and verify), so
# the dependency ran that battery twice per gate (FU-23 (a)). `ci` keeps
# `release-smoke` as the blocking tier's smoke run.
depends = ["fmt", "lint", "test-full", "benchmark", "audit", "package-check", "claims-audit", "gate-aspects"]
run = "cargo run -q -p pleiades-validate -- release-gate"

[tasks.ci]
depends = ["fmt", "lint", "docs", "audit", "deny", "secrets", "claims-audit", "test", "doctest", "release-smoke"]

[tasks.ci-nightly]
description = "Nightly tier: slow/broad checks (fail-loud, not fail-blocking)."
depends = ["test-full", "package-check", "benchmark", "deny", "secrets"]

[tasks.gate-houses]
run = "cargo run -q -p pleiades-validate -- validate-houses"

[tasks.gate-ayanamsa]
run = "cargo run -q -p pleiades-validate -- validate-ayanamsa"

[tasks.gate-apparent]
run = "cargo run -q -p pleiades-validate -- validate-apparent"

[tasks.gate-topocentric]
run = "cargo run -q -p pleiades-validate -- validate-topocentric"

[tasks.gate-corpus]
run = "cargo run -q -p pleiades-validate -- validate-corpus"

[tasks.gate-aspects]
# Full exact-aspect gate (all 11 corpus pairs, ~15 min; 18.5 min as the in-crate test): too slow for
# nightly `test-full`, so it has its own nightly job (.github/workflows/
# nightly.yml `aspects-gate`) and is a `release-gate` dependency. The mean
# subset runs in the release battery (`release-smoke`).
run = "cargo run -q -p pleiades-validate -- validate-aspects"

[tasks.compat-claims-audit]
run = "cargo run -q -p pleiades-validate -- compat-claims-audit"
